# What this instance is, and what satisfies each contract it needs.
#
# The engine owns the shapes in this file; this file owns their values. That
# split is why a second company is a folder of configuration rather than a
# second copy of the engine.

# Appears in logs and run records. Not a tenant key — one deployment is one
# tenant, and the engine has no column for a second.
instance: example

# A domain may only be enabled with everything it depends on. `gtm` depends on
# `relations`, and leaving `relations` out is refused here rather than
# discovered when a foreign key points at a schema nobody installed.
enabledDomains:
  - relations
  - gtm

# The networks a social profile or company id may belong to (decision 0013).
# Named here, never in the engine. A key on a network not listed is refused.
# `sandbox` is the invented network of the sandbox enrichment's profile ids;
# remove it with that binding.
networks:
  - sandbox

# Every contract the engine has, each bound to a sandbox adapter that answers
# from invented data in adapters/sandbox-data.json. With these, a new instance
# migrates, verifies and runs its enrolment path before anyone has an account
# anywhere. Replace them one at a time with real adapters — `example-crm.ts`
# shows how one talks to an API — and add the variables each one needs to
# `env` and to .env.example.
#
# A relative path is an adapter in this instance; a bare specifier is a
# published package. A contract may be bound once per channel (0015).
providers:
  - contract: target_list
    adapter: ./adapters/sandbox-target-list.ts
    env: []
  - contract: enrichment
    adapter: ./adapters/sandbox-enrichment.ts
    env: []
    options:
      network: sandbox
  - contract: sequencer
    adapter: ./adapters/sandbox-sequencer.ts
    env: []
  - contract: inbound
    adapter: ./adapters/sandbox-inbound.ts
    env: []
  - contract: metrics
    adapter: ./adapters/sandbox-metrics.ts
    env: []
  - contract: crm
    adapter: ./adapters/sandbox-crm.ts
    env: []

  # A real binding looks like this:
  #
  # - contract: sequencer
  #   adapter: "@werunfoundry/gtm/adapters/<provider>"
  #   env: [PROVIDER_API_KEY]
  #   channels: [email]
  #   options:
  #     campaign.welcome: <the provider's id for the sequence>

# Where the truth documents live, relative to this file.
truthsDir: truths
