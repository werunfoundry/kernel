name: acquisition
version: 0.0.0
description: Acquisition — producing outbound and handling what comes back.
schema: acquisition
# The names this domain was known by (decision 0046): migrations applied
# under them are recognised, not replayed.
formerly: [gtm]
dependsOn:
  - relations
# Contributed to the shared vocabulary. A channel may only be used by a touch
# once a enabled domain declares it here.
channels:
  - email
  - social_message
  - social_invite
  - social_comment
  - profile_visit
experimentTypes:
  - campaign
  - audience_test
  - message_test
  - channel_test
  - signal_play
  - offer_test
# Kinds of truth this domain understands. The shapes live in
# manifest/types.ts; without the declaration here, no instance may hold one.
truthKinds:
  - icp
  - persona
# What an instance may set on a binding, under `settings.acquisition`, for
# this domain to read and never the adapter (decision 0069). `wayOut` on a
# sequencer binding: the line the
# kernel adds after every body it writes, with the provider's link in it, or
# `cut` (decisions 0065, 0067).
bindingSettings:
  - contract: sequencer
    key: wayOut
eventTypes:
  - acquisition.signup
  - acquisition.reply
  - acquisition.bounce
  - acquisition.unsubscribe
  - acquisition.meeting_booked
# The numbers this domain defines, and what each experiment type is judged on
# (decision 0018). A metric source says which it can read; none is stored.
metrics:
  - key: acquisition.enrolled
    unit: people
  - key: acquisition.replied
    unit: people
  # Email only: elsewhere they are not applicable, never zero.
  - key: acquisition.bounced
    unit: people
    channels: [email]
  - key: acquisition.unsubscribed
    unit: people
    channels: [email]
  - key: acquisition.meetings_booked
    unit: meetings
#
# acquisition.bounced and acquisition.unsubscribed are guardrails, in every type: no type is
# tied to a channel, so any of them can carry email, and an experiment can
# win on replies while it damages deliverability. offer_test reads
# acquisition.replied too, to tell "nobody bit" from "people replied and did not
# book". channel_test is judged on meetings booked per person enrolled — an
# outcome that means the same on every channel — and not on replies, whose
# rate does not compare across channels at equal volume; replies stay
# readable per channel, as a diagnostic.
experimentMetrics:
  campaign: [acquisition.enrolled, acquisition.replied, acquisition.meetings_booked, acquisition.bounced, acquisition.unsubscribed]
  audience_test: [acquisition.enrolled, acquisition.replied, acquisition.bounced, acquisition.unsubscribed]
  message_test: [acquisition.enrolled, acquisition.replied, acquisition.bounced, acquisition.unsubscribed]
  channel_test: [acquisition.enrolled, acquisition.meetings_booked, acquisition.bounced, acquisition.unsubscribed]
  signal_play: [acquisition.enrolled, acquisition.replied, acquisition.meetings_booked, acquisition.bounced, acquisition.unsubscribed]
  offer_test: [acquisition.enrolled, acquisition.replied, acquisition.meetings_booked, acquisition.bounced, acquisition.unsubscribed]
# Before any rule, outside the transaction (decision 0056): every enrolment a
# provider may still hold is suspended there, read back and recorded, or the
# erasure is refused and changes nothing. The anonymised row below is then the
# proof that the person was stopped before they were forgotten.
beforeErasure: "@werunfoundry/acquisition/runtime/before-erasure"
# What erasing a person does here (decisions 0040, 0049). A row that exists
# only to say something about the person is deleted. A row that is the
# history of what a run did is anonymised: it says what happened, not who —
# the run, the company targeted, the outcome, the times, what the provider
# said of each key all stay. It is reached by id and by the person's keys,
# since an excluded person or a dry run's is named by keys alone. `subject`
# is a fingerprint of those keys, which anyone holding an address can
# recompute, so it is replaced by a value derived from nothing; `detail` is
# free text written from a provider's or the CRM's answer, which the kernel
# cannot prove clean, so it is replaced by a fixed sentence.
erasure:
  - { table: draft, column: person_id, do: delete }
  - { table: person_state, column: person_id, do: delete }
  # Since 0053, history: what a run did — the sequence, the company, the
  # state, the suspension's method and costs — without who. The key given to
  # the provider is a hash of the person's keys; the refusal and the
  # read-back are the provider's words, and may name them; an attestation is
  # a person's (0056), and may too. Their document is the one the migration's
  # trigger lets a suspended row take.
  - table: enrolment
    column: person_id
    do: anonymise
    columns: [person_id]
    random: [idempotency_key]
    text:
      refusal: "erased (decision 0053); the provider's answer is not kept"
      suspension_read_back: '{"erased": "decision 0053"}'
      suspension_attestation: '{"erased": "decision 0053"}'
      # The way out's line and link name the person's record at the
      # provider (0067); the state and the times stand.
      way_out_line: "erased (decision 0053)"
      way_out_link: "erased (decision 0053)"
  - table: sourcing_result
    column: person_id
    keys: person
    do: anonymise
    columns: [person_id, person]
    strip: { said: [key.value] }
    random: [subject]
    text: { detail: "erased (decision 0049); the outcome stands" }
  - table: enrolment_skip
    keys: person
    do: anonymise
    columns: [person]
    random: [subject]
    text: { detail: "erased (decision 0049); the reason stands" }
