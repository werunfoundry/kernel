name: relations
version: 0.0.0
description: The shared record — people, companies, audiences, interactions, signals.
schema: relations
dependsOn: []
channels: []
eventTypes:
  - relations.person.merged
  - relations.person.opted_out
# What names the people and companies this domain owns (decision 0013).
# Immutable keys are authoritative; mutable ones are evidence. A networked key
# belongs to a network the instance declares in its manifest — never here,
# because naming a network names a provider.
identityKeys:
  - kind: email
    subject: person
    immutable: false
    caseInsensitive: true
  - kind: social_profile_id
    subject: person
    immutable: true
    networked: true
  # The handle a network's profile URLs are built from. Mutable — a person can
  # change it — so it is evidence, never the key two identities are matched on.
  - kind: social_profile_handle
    subject: person
    immutable: false
    networked: true
  # A number as the provider wrote it — `+33 1 42 86 82 82` and
  # `+33142868282` are two values, because nothing normalises a number yet.
  # Mutable, so two spellings are at worst two pieces of evidence, never a
  # conflict, and nothing is matched or protected on it.
  - kind: phone
    subject: person
    immutable: false
  - kind: domain
    subject: company
    immutable: false
    caseInsensitive: true
    # A source writes `http://Example.com/about` as readily as `example.com`
    # (decision 0028); both name one company.
    hostname: true
  - kind: social_company_id
    subject: company
    immutable: true
    networked: true
# What erasing a person does here (decision 0040). Nothing in this domain is
# kept under a legal basis: an obligation that outlives erasure belongs to the
# domain that has it. The person's own row goes last; if a row another domain
# keeps still points at it, it is emptied of what identifies them instead.
erasure:
  - { table: audience_member, column: person_id, do: delete }
  - { table: touch, column: person_id, do: delete }
  - { table: signal, column: person_id, do: delete }
  - { table: person, column: id, do: delete, ifStillNamed: [email, full_name, title, external_id, record_id] }
